name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

jobs:
  # ── Job 1: Build & Typecheck ──────────────────────────────────────────────
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared
        run: cd shared && npx tsc --noEmit

      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit

      - name: Typecheck frontend
        run: cd frontend && npx tsc --noEmit

      - name: Build shared
        run: cd shared && npx tsc

      - name: Build frontend
        run: cd frontend && npx vite build

  # ── Job 2: Integration Tests ─────────────────────────────────────────────
  test:
    name: Integration Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nepocorp
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations on test DB
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nepocorp
        run: npx drizzle-kit migrate

      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nepocorp
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci-not-production
          NODE_ENV: test
        run: npx tsx --test 'src/tests/*.test.ts'

  # ── Job 3: Docker Build & Push ───────────────────────────────────────────
  docker:
    name: Docker Build & Push
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            franknguyenvd/nepo-backend:latest
            franknguyenvd/nepo-backend:${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=franknguyenvd/nepo-backend:latest
          cache-to: type=inline

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            franknguyenvd/nepo-frontend:latest
            franknguyenvd/nepo-frontend:${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=franknguyenvd/nepo-frontend:latest
          cache-to: type=inline

  # ── Job 4: Deploy to Production ──────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Pull and restart backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/nepocorp
            docker compose -f deploy/docker-compose.prod.yml pull backend
            docker compose -f deploy/docker-compose.prod.yml up -d --force-recreate --no-deps backend

      - name: Run database migrations
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/nepocorp
            docker compose -f deploy/docker-compose.prod.yml exec -T backend npx drizzle-kit migrate

      - name: Pull and restart frontend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/nepocorp
            docker compose -f deploy/docker-compose.prod.yml pull frontend
            docker compose -f deploy/docker-compose.prod.yml up -d --force-recreate --no-deps frontend
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER }}
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            curl -sf http://localhost:3090/api/health || (echo "Backend health check failed!" && exit 1)
            curl -sf -o /dev/null http://localhost:3000 || (echo "Frontend health check failed!" && exit 1)
            echo "Deployment verified successfully."
