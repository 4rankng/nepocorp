name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Build & Typecheck
  # ──────────────────────────────────────────────────────────
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: cd shared && npx tsc

      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit

      - name: Build frontend
        run: cd frontend && npx tsc -b && npx vite build

  # ──────────────────────────────────────────────────────────
  # Job 2: Tests
  # ──────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nepocorp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nepocorp
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build shared (dependency of backend tests)
        run: cd shared && npx tsc

      - name: Run shared unit tests
        working-directory: backend
        run: |
          npx tsx --test ../shared/src/calculations/tripTotals.test.ts
          npx tsx --test ../shared/src/schemas/updateTripFiguresSchema.test.ts

      - name: Apply migrations to test DB
        run: cd backend && npx drizzle-kit migrate

      - name: Run backend integration tests
        run: cd backend && npx tsx --test src/tests/integration.test.ts

  # ──────────────────────────────────────────────────────────
  # Job 3: Docker Build & Push
  # ──────────────────────────────────────────────────────────
  docker-push:
    name: Docker Push (${{ matrix.name }})
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: backend
            image: franknguyenvd/nepo-backend
            dockerfile: backend/Dockerfile
          - name: frontend
            image: franknguyenvd/nepo-frontend
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate short SHA tag
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.sha.outputs.short }}
          cache-from: type=registry,ref=${{ matrix.image }}:latest
          build-args: BUILDKIT_INLINE_CACHE=1

  # ──────────────────────────────────────────────────────────
  # Job 4: Deploy to Production
  # ──────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [docker-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: nepo.tingting.vip
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying Nepocorp ==="

            cd /opt/nepocorp

            echo "Pulling latest images..."
            docker compose -f deploy/docker-compose.prod.yml pull backend frontend

            echo "Restarting backend..."
            docker compose -f deploy/docker-compose.prod.yml up -d --force-recreate --no-deps backend

            echo "Waiting for backend to start..."
            for i in $(seq 1 20); do
              if docker compose -f deploy/docker-compose.prod.yml exec -T backend \
                 wget -q --spider http://localhost:3090/api/health 2>/dev/null; then
                echo "Backend is healthy after ${i}s"
                break
              fi
              if [ "$i" -eq 20 ]; then
                echo "ERROR: Backend failed to start within 20s"
                docker compose -f deploy/docker-compose.prod.yml logs --tail=30 backend
                exit 1
              fi
              sleep 1
            done

            echo "Running database migrations..."
            docker compose -f deploy/docker-compose.prod.yml exec -T backend npx drizzle-kit migrate

            echo "Restarting frontend..."
            docker compose -f deploy/docker-compose.prod.yml up -d --force-recreate --no-deps frontend

            echo "Cleaning up unused images..."
            docker image prune -f

            echo "=== Deployment complete! ==="
            echo "App: https://nepo.tingting.vip"
            echo "API: https://nepo.tingting.vip/api/health"
