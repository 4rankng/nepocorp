# ── Initial HTTP config ──────────────────────────────────────────────────────
# This is the initial config before Certbot adds SSL.
# After running `certbot --nginx -d nepo.tingting.vip`, Certbot will:
#   1. Add ssl_certificate directives
#   2. Create a separate 443 server block
#   3. Redirect HTTP → HTTPS
#
# To update the server config AFTER certbot has run:
#   1. Edit this file or the one certbot created
#   2. Run: ssh root@nepo.tingting.vip 'nginx -t && systemctl reload nginx'

server {
    listen 80;
    listen [::]:80;
    server_name nepo.tingting.vip;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /uploads/ {
        alias /opt/nepocorp/data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 20m;
    }

    location /adminer/ {
        proxy_pass         http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
