name: demo

# ── demo.tingting.vip (nepocorp demo staging) ─────────────────────────────────
# Second stack on the vantai droplet, alongside the vantai stack.
# Differences from docker-compose.prod.yml:
#   - compose project / db / user: `demo`; volumes under /opt/demo
#   - host ports 3091 (backend) / 3001 (frontend) / 8081 (adminer, profile-gated)
#     — 3090/3000/8080 are taken by the vantai stack
#   - redis capped at 64MB (droplet is 1GB RAM hosting two stacks)
#   - CORS_ORIGIN=https://demo.tingting.vip
# Served by the host nginx vhost deploy/nginx-host-demo.conf.
# Data is a one-time anonymized prod snapshot (2026-09-03, ad hoc SQL —
# deliberately not committed; approach recorded in plans/journals).

services:
  postgres:
    # pgvector/pgvector:pg16 = upstream postgres:16 + the `vector` extension
    # preinstalled. Required for the FAQ fast lane (vector(1536) cosine index).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-DemoStaging2026}
      POSTGRES_DB: demo
    volumes:
      - /opt/demo/data/postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --appendonly yes
    expose:
      - "6379"
    volumes:
      - /opt/demo/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: franknguyenvd/tingting-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://demo:${DB_PASSWORD:-DemoStaging2026}@postgres:5432/demo
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - PORT=3090
      - UPLOAD_DIR=/app/backend/uploads
      - CORS_ORIGIN=https://demo.tingting.vip
    expose:
      - "3090"
    ports:
      - "127.0.0.1:3091:3090"
    volumes:
      - /opt/demo/data/uploads:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: franknguyenvd/tingting-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:3001:80"

  adminer:
    image: adminer:latest
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8081:8080"
    profiles:
      - adminer
    depends_on:
      postgres:
        condition: service_healthy
