# ── demo.tingting.vip (nepocorp demo staging) — host nginx config ──────────────
# Live file: /etc/nginx/sites-available/demo (symlinked from sites-enabled/demo).
# SSL block + `listen 443` lines are ADDED BY CERTBOT on first run
# (certbot --nginx -d demo.tingting.vip) — do not hand-edit those afterwards.
#
# To update the server config (before certbot has run):
#   1. scp deploy/nginx-host-demo.conf root@vantai.tingting.vip:/etc/nginx/sites-available/demo
#   2. ssh root@vantai.tingting.vip 'nginx -t && systemctl reload nginx'
#
# Ports differ from the vantai vhost on the same box: demo backend 3091,
# demo frontend 3001. The `/socket.io/` block MUST sit above `location /`
# so the assistant (/agent namespace, path /socket.io) polling handshake +
# WebSocket upgrade reach the demo backend instead of the frontend SPA.

server {
    listen 80;
    listen [::]:80;
    server_name demo.tingting.vip;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /uploads/ {
        alias /opt/demo/data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:3091;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 20m;
    }

    # socket.io — assistant transport (/agent namespace, path /socket.io).
    # Sits above `location /` so the polling handshake + WebSocket upgrade
    # reach the demo backend (3091) instead of the frontend SPA. 300s keeps
    # long multi-tool assistant turns alive.
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3091;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
