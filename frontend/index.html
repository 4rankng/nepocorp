<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />

    <!-- Favicons — all sourced from /assets/logo.avif (re-rendered to PNG at build time).
         AVIF as primary for modern browsers; PNG fallback for older ones + Apple. -->
    <link rel="icon" type="image/avif" href="/assets/logo.avif" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />

    <!-- ─── PWA / Add to Home Screen ──────────────────────────────────────── -->
    <!-- Standalone display when launched from home screen (no browser chrome) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00B14F" />
    <meta name="color-scheme" content="light" />

    <!-- iOS Safari: "Add to Home Screen" standalone mode.
         When Pete taps Share → Add to Home Screen and re-opens the icon,
         iOS reads these tags to launch full-screen without the Safari URL bar
         and bottom toolbar. iOS requires PNG for apple-touch-icon (AVIF
         is silently rejected → falls back to a screenshot of the page). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TingTing" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/logo-180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/logo-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/logo-512.png" />

    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <title>TingTing Transport</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
