    FuelPrice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "fprice-123e4567-e89b-12d3-a456-426614174000"
        date:
          type: string
          format: date
          example: "2024-07-28"
        pricePerLiter:
          type: number
          format: double
          example: 22500
      required:
        - id
        - date
        - pricePerLiter
    FuelPriceCreateRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2024-07-29"
        pricePerLiter:
          type: number
          format: double
          example: 22700
      required:
        - date
        - pricePerLiter
    MileageRate:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "mrate-123e4567-e89b-12d3-a456-426614174000"
        description:
          type: string
          example: "Định mức chung"
        ratePerKm: # Định mức dầu / km
          type: number
          format: double
          example: 0.3 # liters per km
        minKm: # Km tối thiểu áp dụng định mức
          type: number
          format: double
          example: 0
        maxKm: # Km tối đa áp dụng định mức (optional)
          type: number
          format: double
          nullable: true
          example: 500
      required:
        - id
        - description
        - ratePerKm
        - minKm
    MileageRateCreateRequest:
      type: object
      properties:
        description:
          type: string
          example: "Định mức cho xe tải nặng"
        ratePerKm:
          type: number
          format: double
          example: 0.35
        minKm:
          type: number
          format: double
          example: 100
        maxKm:
          type: number
          format: double
          nullable: true
          example: 1000
      required:
        - description
        - ratePerKm
        - minKm
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid # Assuming UUID for IDs
          example: "123e4567-e89b-12d3-a456-426614174000"
        username:
          type: string
          example: "adminuser"
        employeeId:
          type: string
          format: uuid
          example: "abcdef01-e89b-12d3-a456-426614174001"
        role:
          type: string
          enum: [admin, manager, accountant, dispatcher, driver] # Example roles
          example: admin
      required:
        - id
        - username
        - employeeId
        - role
    UserCreateRequest:
      type: object
      properties:
        username:
          type: string
          example: "newuser"
        password:
          type: string
          format: password
          example: "secureP@ssw0rd"
        employeeId:
          type: string
          format: uuid
          example: "abcdef01-e89b-12d3-a456-426614174002"
        role:
          type: string
          enum: [admin, manager, accountant, dispatcher, driver]
          example: manager
      required:
        - username
        - password
        - employeeId
        - role
    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
          example: "updateduser"
        employeeId:
          type: string
          format: uuid
          example: "abcdef01-e89b-12d3-a456-426614174003"
        role:
          type: string
          enum: [admin, manager, accountant, dispatcher, driver]
          example: accountant
    UserLoginRequest:
      type: object
      properties:
        username:
          type: string
          example: user1
        password:
          type: string
          example: stringP@ssw0rd
      required:
        - username
        - password
    UserLoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
      required:
        - email
    PasswordResetTokenRequest:
      type: object
      properties:
        token:
          type: string
          example: reset_token_string
        newPassword:
          type: string
          example: newStringP@ssw0rd
      required:
        - token
        - newPassword
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        code:
          type: integer
          format: int32
      required:
        - message
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
