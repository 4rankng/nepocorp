components:
  schemas:
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "abcdef01-e89b-12d3-a456-426614174001"
        name:
          type: string
          example: "Nguyễn Văn A"
        email:
          type: string
          format: email
          example: "nv.a@example.com"
        role:
          type: string
          enum: ["Quản lý", "Kế toán", "Giao nhận", "Lái xe"]
          example: "Lái xe"
      required:
        - id
        - name
        - email
        - role
    EmployeeCreateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Trần Thị B"
        email:
          type: string
          format: email
          example: "tt.b@example.com"
        role:
          type: string
          enum: ["Quản lý", "Kế toán", "Giao nhận", "Lái xe"]
          example: "Kế toán"
      required:
        - name
        - email
        - role
    EmployeeUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Lê Văn C"
        email:
          type: string
          format: email
          example: "lv.c@example.com"
        role:
          type: string
          enum: ["Quản lý", "Kế toán", "Giao nhận", "Lái xe"]
          example: "Quản lý"

