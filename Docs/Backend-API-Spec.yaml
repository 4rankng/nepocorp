          example: "Công ty Khách hàng A"
        receivableAmount: # Số tiền phải thu
          type: number
          format: double
          example: 10000000
        payableAmount: # Số tiền phải trả
          type: number
          format: double
          example: 0
        notes:
          type: string
          nullable: true
          example: "Công nợ tháng 7/2024"
        month:
          type: string
          example: "07"
        year:
          type: integer
          example: 2024
      required:
        - id
        - entityName
        - month
        - year
    DebtCreateRequest:
      type: object
      properties:
        entityName:
          type: string
        receivableAmount:
          type: number
          format: double
          default: 0
        payableAmount:
          type: number
          format: double
          default: 0
        notes:
          type: string
          nullable: true
        month:
          type: string
        year:
          type: integer
      required:
        - entityName
        - month
        - year
    DebtUpdateRequest:
      type: object
      properties:
        entityName:
          type: string
        receivableAmount:
          type: number
          format: double
        payableAmount:
          type: number
          format: double
        notes:
          type: string
          nullable: true
        month:
          type: string
        year:
          type: integer

  # Supporting Entities

  # Fuel Price Management
  /fuel-prices:
    get:
      summary: List fuel prices
      description: Retrieves a list of fuel prices, optionally filtered by date.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          description: Filter by specific date (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: A list of fuel prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuelPrice'
        '400':
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add a new fuel price entry
      description: Adds a new fuel price entry for a specific date.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelPriceCreateRequest'
      responses:
        '201':
          description: Fuel price entry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelPrice'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /fuel-prices/{priceId}:
    get:
      summary: Get fuel price entry
      description: Retrieves a specific fuel price entry by its ID.
      security:
        - bearerAuth: []
      parameters:
        - name: priceId
          in: path
          required: true
          description: ID of the fuel price entry
          schema:
            type: string
            format: uuid
            example: "fprice-123e4567-e89b-12d3-a456-426614174000"
      responses:
        '200':
          description: Fuel price entry details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelPrice'
        '401':
          description: Unauthorized
        '404':
          description: Fuel price entry not found
        '500':
          description: Internal server error
    put:
      summary: Update fuel price entry
      description: Updates a specific fuel price entry.
      security:
        - bearerAuth: []
      parameters:
        - name: priceId
          in: path
          required: true
          description: ID of the fuel price entry to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelPriceCreateRequest' # Re-use create schema for update
      responses:
        '200':
          description: Fuel price entry updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuelPrice'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Fuel price entry not found
        '500':
          description: Internal server error
    delete:
      summary: Delete fuel price entry
      description: Deletes a specific fuel price entry.
      security:
        - bearerAuth: []
      parameters:
        - name: priceId
          in: path
          required: true
          description: ID of the fuel price entry to delete
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Fuel price entry deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Fuel price entry not found
        '500':
          description: Internal server error

