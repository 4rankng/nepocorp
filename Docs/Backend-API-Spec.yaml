      required:
        - description
        - amount
    TransportSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "schedule-123e4567-e89b-12d3-a456-426614174000"
        date:
          type: string
          format: date
          example: "2024-07-28"
        vehicleId:
          type: string
          format: uuid
          example: "vehicle-123e4567-e89b-12d3-a456-426614174000"
        partnerId: # Optional, if subcontracted
          type: string
          format: uuid
          nullable: true
          example: "partner-123e4567-e89b-12d3-a456-426614174000"
        description:
          type: string
          example: "Vận chuyển hàng cho công ty ABC"
        routeId:
          type: string
          format: uuid
          example: "route-123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          enum: [planned, in_progress, completed, cancelled]
          example: "completed"
        cargoKm:
          type: number
          format: double
          example: 150.5
        emptyKm:
          type: number
          format: double
          example: 20.0
        fuelLiters:
          type: number
          format: double
          example: 50.25
        fuelUnitPrice:
          type: number
          format: double
          example: 22000
        fuelCost:
          type: number
          format: double
          example: 1105500
        roadCostPreset: # If using a preset value for road costs
          type: number
          format: double
          nullable: true
          example: 300000
        otherCosts:
          type: array
          items:
            $ref: '#/components/schemas/CostItem'
        containerNumber:
          type: string
          nullable: true
          example: "TCLU1234567"
        sealNumber:
          type: string
          nullable: true
          example: "SEAL12345"
        deliveryDate:
          type: string
          format: date-time
          nullable: true
          example: "2024-07-29T10:00:00Z"
        customerId:
          type: string
          format: uuid
          example: "client-123e4567-e89b-12d3-a456-426614174000"
        containerTypeId:
          type: string
          format: uuid
          example: "ctype-123e4567-e89b-12d3-a456-426614174000"
        freightCharge: # Cước vận chuyển thu từ khách hàng
          type: number
          format: double
          example: 5000000
        subcontractedFreightCharge: # Cước trả cho đối tác (nếu có)
          type: number
          format: double
          nullable: true
          example: 4500000
      required:
        - id
        - date
        - vehicleId
        - description
        - routeId
        - status
        - customerId
        - containerTypeId
        - freightCharge
