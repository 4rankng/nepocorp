version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nepo_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nepo
      MYSQL_USER: nepo
      MYSQL_PASSWORD: nepo_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nepo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    build: .
    container_name: nepo_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DEBUG=false
      - RUN_MIGRATIONS=true
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=nepo
      - DB_PASSWORD=nepo_password
      - DB_NAME=nepo
      - JWT_SECRET=your-secret-key-change-in-production
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_RPS=10
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nepo_network

  adminer:
    image: adminer:latest
    container_name: nepo_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
    depends_on:
      - mysql
    networks:
      - nepo_network

volumes:
  mysql_data:

networks:
  nepo_network:
    driver: bridge